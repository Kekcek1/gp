<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050816">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Астрощит — космическая аркада о защите планеты. Отражай астероиды, собирай кристаллы и улучшай щит.">
  <title>Астрощит — оборона планеты</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preload" href="assets/fonts/russo-one-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/exo2-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <div id="app">
    <canvas id="game" tabindex="0" aria-label="Астрощит — игровое поле"></canvas>

    <div id="boot" class="boot" aria-hidden="true">
      <div class="boot__bg"></div>
      <div class="boot__content">
        <div class="boot__mark">
          <span class="boot__planet"></span>
          <span class="boot__ring"></span>
          <span class="boot__arc"></span>
        </div>
        <h1 class="boot__title" id="bootTitle">Астрощит</h1>
        <p class="boot__subtitle" id="bootSubtitle">ОБОРОНА ПЛАНЕТЫ</p>
        <div class="boot__bar"><i id="bootBar"></i></div>
        <p class="boot__hint" id="bootHint">ЗАГРУЗКА</p>
      </div>
    </div>

    <noscript>
      <div class="noscript">Для игры нужен включённый JavaScript.</div>
    </noscript>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/core.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sdk.js"></script>
  <script src="js/game.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
